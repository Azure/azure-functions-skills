jobs:
    - job: UnitTests

      strategy:
          matrix:
              Node20:
                  NODE_VERSION: '20.x'
              Node22:
                  NODE_VERSION: '22.x'
              Node24:
                  NODE_VERSION: '24.x'

      steps:
          - task: NodeTool@0
            inputs:
                versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'
          - task: npmAuthenticate@0
            inputs:
                workingFile: '$(Build.SourcesDirectory)/.npmrc'
            displayName: 'Authenticate to Central Feed Service'
          - script: npm ci --include=optional
            displayName: 'npm ci'
          - script: npm run lint
            displayName: 'npm run lint'
          - script: npm run typecheck
            displayName: 'npm run typecheck'
          - script: npm test
            displayName: 'Run unit tests'
