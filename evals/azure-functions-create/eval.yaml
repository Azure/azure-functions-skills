name: azure-functions-create-eval
description: |
  Evaluation suite for the azure-functions-create skill.

  Covers:
    - Routing (skill-invocation) for typical "create a function" prompts
      across TypeScript HTTP, Python timer, Go HTTP, and existing-project
      flows.
    - Response-quality checks that the skill follows Path A (Azure MCP)
      when available, does not fabricate template IDs, and includes
      proper local end-to-end verification.
    - Go (Path C): Go has no Azure MCP template and no manifest entry,
      so the skill must scaffold with Core Tools or the worker SDK, use
      FUNCTIONS_WORKER_RUNTIME=native, use the lower-case module path,
      and never author function.json. One Go stimulus actually runs the
      scaffold and builds it, because a prose-only check cannot catch a
      project that reads correctly but does not compile.
    - "Do not re-initialize an existing project" guardrail.

  Environment:
    - Each stimulus attaches the Azure MCP server (`@azure/mcp`) via
      stdio, scoped to the `functions` namespace. All three Functions
      tools (`functions_language_list`, `functions_project_get`,
      `functions_template_get`) are readOnly and require no Azure
      credentials, so this works in plain CI.
    - Cold start is slow because `npx -y @azure/mcp@latest` downloads
      the package on first run. Subsequent runs are fast thanks to npm
      cache; CI can pre-warm via `npm install -g @azure/mcp@latest` or
      `npx -y @azure/mcp@latest server --help`.

  Notes:
    - Built-in graders only (skill-invocation / output-contains /
      output-matches / output-not-matches / completed). We rely on
      Vally's standard `copilot-sdk` executor; no custom executor tags
      such as earlyTerminate are used.
    - Global graders (`completed`, `no_runtime_failure`) are duplicated
      into each stimulus per evaluate#125. See ../_base/common-graders.yaml.

tags:
  type: integration
  skill: azure-functions-create

config:
  runs: 3
  timeout: "10m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 0.8
  weights:
    skill-invocation: 2.0
    tool-calls: 2.0
    run-command: 2.0
    file-exists: 1.0
    file-not-exists: 1.5
    output-contains: 0.5
    output-matches: 1.0
    output-not-matches: 1.5
    completed: 1.0

stimuli:
  # ─────────────────────────────────────────────────────────────────
  # Routing — skill invocation (tier: smoke)
  # Use runs: 5 / threshold 0.8 to measure invocation rate.
  # ─────────────────────────────────────────────────────────────────

  - name: "Routing — create TypeScript HTTP function"
    prompt: |
      I want to create a new Azure Functions project in TypeScript with an HTTP trigger.
      Please scaffold it for me.
    tags:
      type: integration
      skill: azure-functions-create
      tier: smoke
      cost: llm
      area: routing
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
    constraints:
      max_turns: 12
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  - name: "Routing — create Python timer function"
    prompt: |
      Create a new Python Azure Functions project with a timer trigger that runs every 5 minutes.
    tags:
      type: integration
      skill: azure-functions-create
      tier: smoke
      cost: llm
      area: routing
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
    constraints:
      max_turns: 12
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  - name: "Routing — add function to existing project"
    prompt: |
      I already have an Azure Functions project (host.json is present).
      Please add a new HTTP trigger function to it; do not re-initialize the project.
    tags:
      type: integration
      skill: azure-functions-create
      tier: smoke
      cost: llm
      area: routing
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
      files:
        - src: fixtures/existing-project/host.json
          dest: host.json
        - src: fixtures/existing-project/package.json
          dest: package.json
    constraints:
      max_turns: 12
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  # ─────────────────────────────────────────────────────────────────
  # Response quality (tier: full)
  # ─────────────────────────────────────────────────────────────────

  - name: "Quality — uses Azure MCP path when scaffolding TypeScript HTTP"
    prompt: |
      Create a TypeScript Azure Functions project with an HTTP trigger named "hello".
      Walk me through the scaffolding step by step before writing files.
    tags:
      type: integration
      skill: azure-functions-create
      tier: full
      cost: llm
      area: response-quality
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
    constraints:
      max_turns: 20
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      # MCP-first guidance must be mentioned (tool names or "Azure MCP")
      - type: output-matches
        config:
          pattern: "(?i)functions_(template|project|language)_(get|list)|Azure MCP"
      # Must reference a properly-suffixed MCP template ID, not a bare alias
      - type: output-matches
        config:
          pattern: "http-trigger-typescript(-azd)?"
      # Must NOT invent the bare ".NET-style" alias as the actual template ID
      - type: output-not-matches
        config:
          pattern: "(?<![\\w-])HttpTrigger(?![\\w-])"
      # Must propose `func start` based verification
      - type: output-contains
        config:
          substring: "func start"
      # Globals
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  - name: "Quality — HTTP verify uses real request, not just host start"
    prompt: |
      Please scaffold a new TypeScript HTTP-triggered Azure Functions project for me.
      As part of the scaffolding, also walk me through the local end-to-end verification step
      I should run after the files are written.
    tags:
      type: integration
      skill: azure-functions-create
      tier: full
      cost: llm
      area: response-quality
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
    constraints:
      max_turns: 20
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      - type: output-contains
        config:
          substring: "func start"
      # For HTTP triggers the skill must instruct a real request (curl / GET / localhost:7071)
      - type: output-matches
        config:
          pattern: "(?i)curl|localhost:7071|GET .*?/api/"
      # Globals
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  - name: "Quality — do NOT re-initialize an existing project"
    prompt: |
      I have an existing Azure Functions TypeScript project (host.json is present).
      Please add a new Service Bus queue trigger function to it.
      Do not re-initialize the project — just add the new function file alongside the existing ones.
    tags:
      type: integration
      skill: azure-functions-create
      tier: full
      cost: llm
      area: response-quality
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
      files:
        - src: fixtures/existing-project/host.json
          dest: host.json
        - src: fixtures/existing-project/package.json
          dest: package.json
    constraints:
      max_turns: 20
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      # Must NOT instruct `func init` (would overwrite host.json)
      - type: output-not-matches
        config:
          pattern: "(?i)func init"
      # Should reference the "add to existing project" path
      - type: output-matches
        config:
          pattern: "(?i)existing project|functions_template_get|add (a |the |new )?(function|trigger)"
      # Globals
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  # ─────────────────────────────────────────────────────────────────
  # Go (preview) — Path C
  # Go has no Azure MCP template and no manifest entry, so the skill
  # must route to Path C instead of fabricating a template ID or
  # silently substituting another language.  #
  # NOTE: the Go stimuli drop `panic:` from the runtime-failure
  # pattern used elsewhere in this suite. Go guidance legitimately
  # discusses goroutine panics (GO-001 / sdk.RecoverTo), so `panic:`
  # is an expected substring rather than a crash signal here.  # ─────────────────────────────────────────────────────────────────

  - name: "Routing — create Go HTTP function"
    prompt: |
      I want to create a new Azure Functions project in Go with an HTTP trigger.
      Please scaffold it for me.
    tags:
      type: integration
      skill: azure-functions-create
      tier: smoke
      cost: llm
      area: routing
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
    constraints:
      max_turns: 12
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  - name: "Quality — Go scaffolding follows Path C and the native runtime"
    prompt: |
      Create a Go Azure Functions project with an HTTP trigger named "hello".
      Walk me through the scaffolding step by step before writing files, and
      show me the contents of local.settings.json and host.json.
    tags:
      type: integration
      skill: azure-functions-create
      tier: full
      cost: llm
      area: response-quality
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
    constraints:
      max_turns: 20
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      # Must use the native worker runtime, never "go" or "golang"
      - name: go_uses_native_runtime
        type: output-matches
        config:
          pattern: "(?i)FUNCTIONS_WORKER_RUNTIME[^\\n]{0,40}native"
      - name: go_not_go_runtime_value
        type: output-not-matches
        config:
          pattern: "(?i)FUNCTIONS_WORKER_RUNTIME[\"'\\s:=]+[\"'](go|golang)[\"']"
      # Must use the lower-case module path
      - name: go_lowercase_module_path
        type: output-contains
        config:
          substring: "github.com/azure/azure-functions-golang-worker"
      # Must register in code via the worker SDK
      - name: go_worker_start
        type: output-matches
        config:
          pattern: "worker\\.Start|sdk\\.FunctionApp"
      # Must state that Go does not use function.json. This is asserted
      # positively rather than by forbidding the phrase "create
      # function.json", because a proximity pattern also matches correct
      # negative guidance such as "do not create function.json".
      - name: go_states_no_function_json
        type: output-matches
        config:
          pattern: "(?i)(?:no|not|never|don't|doesn't|do not|does not|without|avoid)[^.\\n]{0,60}function\\.json|function\\.json[^.\\n]{0,60}(?:is not|isn't|are not|aren't|not used|not needed|does not|doesn't|no longer|has no|conflicts)"
      # And must not actually author one. Asserted on the workspace rather
      # than on command text, so harmless verification such as
      # `find . -name function.json` does not trip it.
      - name: go_does_not_author_function_json
        type: file-not-exists
        config:
          path: function.json
      # Must NOT invent an Azure MCP template ID for Go
      - name: go_no_fabricated_template
        type: output-not-matches
        config:
          pattern: "(?i)http-trigger-go(lang)?(-azd)?"
      # Must propose `func start` based verification
      - type: output-contains
        config:
          substring: "func start"
      # Globals
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  - name: "Execution — Go scaffold actually builds"
    prompt: |
      Create a Go Azure Functions project with an HTTP trigger named "hello"
      directly in the current directory, not in a subdirectory. Actually run
      the commands and write the files, then build the project to prove it
      compiles. Report the exact commands you ran and whether the build
      succeeded.
    tags:
      type: integration
      skill: azure-functions-create
      tier: full
      cost: llm
      area: e2e-scaffold
    environment:
      skills:
        - ../../templates/skills/azure-functions-create
        - ../../templates/skills/azure-functions-common
        - ../../templates/skills/azure-functions-setup
    constraints:
      max_turns: 30
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-create
      # The agent must actually scaffold, using the supported Core Tools
      # command or an explicit module init.
      - name: go_scaffold_command_ran
        type: tool-calls
        config:
          required:
            - name: "^(bash|powershell|run)$"
              command: "\\bfunc\\s+init\\b[^\\n|;&]*--worker-runtime\\s+go\\b|\\bgo\\s+mod\\s+init\\b"
      # The scaffold must produce a real module.
      - name: go_mod_written
        type: file-exists
        config:
          path: go.mod
      - name: go_main_written
        type: file-exists
        config:
          path: main.go
      - name: go_does_not_author_function_json
        type: file-not-exists
        config:
          path: function.json
      # The authoritative check. This compiles the workspace the agent
      # produced and requires a clean exit, rather than trusting the agent's
      # own summary of whether the build worked. This is the assertion that
      # catches a scaffold which reads correctly but does not compile, which
      # is exactly how the `go mod tidy` ordering defect shipped.
      - name: go_scaffold_compiles
        type: run-command
        config:
          command: go
          args: ["build", "./..."]
          expected_exit_code: 0
          timeout: "5m"
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"
