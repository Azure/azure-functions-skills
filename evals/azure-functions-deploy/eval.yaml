name: azure-functions-deploy-live-eval
description: |
  Live (Tier 3) evaluation for the azure-functions-deploy skill.

  This eval ACTUALLY DEPLOYS resources to Azure. It only runs from the
  Skill Evaluation - Azure Live Deploy workflow under the
  functions-skills-live-e2e GitHub Environment (reviewer-gated).

  Fixture:
    Each stimulus runs in a fresh Vally workspace seeded by
    `environment.commands` with the official Azure-Samples Flex
    Consumption TypeScript HTTP quickstart pinned to a known commit.
    That gives us a deploy-ready project so the stimulus exercises
    the deploy skill, not the create skill.

  Environment variables (provided by the workflow):
    AZURE_ENV_NAME        unique azd env name (e.g. afsvally-<runid>-<sha>)
    AZURE_LOCATION        eastus2
    AZURE_SUBSCRIPTION_ID
    AZURE_RESOURCE_GROUP  pre-created by the workflow with tags
                          vally-eval=true so the cleanup safety net
                          can find it later

  Notes:
    - Built-in graders only. Global graders (`completed`,
      `no_runtime_failure`) are duplicated into each stimulus per
      evaluate#125.
    - tier: live → suite filter excludes from smoke/pr/full so this
      never runs accidentally from the regular Vally workflow.

tags:
  type: integration
  skill: azure-functions-deploy

config:
  runs: 1
  timeout: "30m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 0.95
  weights:
    skill-invocation: 2.0
    tool-calls: 2.0
    output-matches: 1.0
    output-not-matches: 1.5
    completed: 1.0

stimuli:
  - name: "Live — deploy TypeScript HTTP FC1 to Azure"
    prompt: |
      The current workspace contains a deploy-ready Azure Functions project
      (TypeScript, HTTP trigger, targeting Flex Consumption / FC1).

      Please deploy it to my Azure subscription using the
      azure-functions-deploy workflow.

      Environment variables that are already set in this session:
        - AZURE_ENV_NAME          (use as the azd environment name)
        - AZURE_LOCATION          (eastus2)
        - AZURE_SUBSCRIPTION_ID
        - AZURE_RESOURCE_GROUP    (pre-created with tags; reuse, do not delete)

      Use the existing resource group; do not create a new one. After the
      deploy finishes, report the Function App's HTTPS hostname so I can
      verify it.

      Do NOT run `azd down` — the workflow handles cleanup outside this
      session.

    tags:
      type: integration
      skill: azure-functions-deploy
      tier: live
      cost: azure
      area: e2e-deploy

    environment:
      skills:
        - ../../templates/skills/azure-functions-deploy
        - ../../templates/skills/azure-functions-common
      mcpServers:
        azure:
          type: stdio
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start", "--namespace", "functions"]
          timeout: "120s"
      commands:
        # Materialize the deploy-ready fixture inside the per-stimulus
        # workspace. Pinned commit so the fixture is reproducible across
        # runs even if upstream changes.
        - "git init -q ."
        - "git remote add origin https://github.com/Azure-Samples/functions-quickstart-typescript-azd.git"
        - "git fetch --depth 1 -q origin cba392291ff7b6c994548aabaa8c06eb4055be54"
        - "git checkout -q FETCH_HEAD"
        - "rm -rf .git"

    constraints:
      max_turns: 40
      max_duration: "25m"

    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-deploy

      # The deploy must actually happen via azd. We check the agent's
      # tool calls directly (not the final assistant message) because
      # `trajectory.output` is just the last message — a result-focused
      # summary that may not echo command names like `azd up` even on
      # a successful deploy. The tool-call grader sees every bash
      # command the agent issued during the session. Only include tools
      # with a `command` argument here; read_bash only has `shellId`.
      - type: tool-calls
        config:
          required:
            - name: "^(bash|powershell|run)$"
              command: "\\bazd\\s+(up|provision|deploy)\\b"

      # Agent must NOT tear down the resources it created — cleanup is
      # owned by the workflow, not the agent. (Skill spec already says
      # this in the prompt; this is the enforcement.)
      - type: tool-calls
        config:
          disallowed:
            - name: "^(bash|powershell|run)$"
              command: "\\bazd\\s+down\\b"

      # Must emit the Function App's azurewebsites.net hostname (proof
      # that the deploy completed and got a URL back).
      - type: output-matches
        config:
          pattern: "https?://[a-z0-9-]+\\.azurewebsites\\.net"

      # Skill explicitly says: do not verify HTTP triggers with HEAD.
      - type: output-not-matches
        config:
          pattern: "curl\\s+-I\\s+https?://"

      # Common deployment failure signals.
      - type: output-not-matches
        config:
          pattern: "(?i)quota exceeded|InvalidTemplateDeployment|AuthorizationFailed|SubscriptionNotRegistered|InsufficientPermissions"

      # Security regression guard: the FC1 quickstart template uses
      # Managed Identity for both deployment storage and runtime
      # storage. If the agent silently falls back to connection strings
      # (e.g. because of missing roleAssignments/write), this grader
      # turns red so we notice the security posture drop. The check is
      # against the final summary because the agent typically reports
      # the workaround it took.
      - type: output-not-matches
        config:
          pattern: "(?i)connection string instead of managed identity|switching .* to use .* connection string"

      # Globals
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed|panic:"

  # ─────────────────────────────────────────────────────────────────
  # Go (preview) — planning only, no Azure resources touched.
  # Go adds several deploy branches that the TypeScript live stimulus
  # never exercises, and its preview constraints are hard limits rather
  # than preferences. This stimulus grades the plan, so it runs in the
  # normal suite instead of the gated live suite.
  #
  # NOTE: `panic:` is dropped from the runtime-failure pattern here
  # because Go guidance legitimately discusses goroutine panics.
  # ─────────────────────────────────────────────────────────────────

  - name: "Quality — Go deployment plan respects preview constraints"
    prompt: |
      I have a Go Azure Functions app with an HTTP trigger and I want to deploy
      it to Azure. Do not deploy anything yet. Walk me through the plan first:
      which hosting plan and operating system I have to use, how the binary gets
      built and packaged, and which app settings matter.
    tags:
      type: integration
      skill: azure-functions-deploy
      tier: full
      cost: llm
      area: response-quality
    environment:
      skills:
        - ../../templates/skills/azure-functions-deploy
        - ../../templates/skills/azure-functions-common
    constraints:
      max_turns: 15
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-functions-deploy

      # Preview hard limits: Flex Consumption only, Linux only.
      # These are asserted positively. A negative grader such as "must not
      # mention a Windows plan" is unusable here, because the required
      # guidance itself says "do not select a Windows-hosted plan" and would
      # match its own prohibition.
      - name: go_flex_consumption_only
        type: output-matches
        config:
          pattern: "(?i)flex consumption"
      - name: go_linux_only_stated
        type: output-matches
        config:
          pattern: "(?i)linux[^.\\n]{0,40}\\bonly\\b|\\bonly\\b[^.\\n]{0,40}linux|windows[^.\\n]{0,60}(?:not supported|unsupported|isn't supported|not available|cannot)|(?:do not|don't|never|avoid)[^.\\n]{0,40}windows"

      # Core Tools owns the build and packaging.
      - name: go_core_tools_packaging
        type: output-matches
        config:
          pattern: "func\\s+pack|func\\s+azure\\s+functionapp\\s+publish"

      # Cross-compilation must be presented as the --no-build case, not
      # as the default workflow.
      - name: go_cross_compile_scoped
        type: output-not-matches
        config:
          pattern: "(?i)you must (always )?(manually )?cross-compile"

      # Native worker runtime.
      - name: go_native_runtime
        type: output-matches
        config:
          pattern: "(?i)FUNCTIONS_WORKER_RUNTIME[^\\n]{0,40}native"

      # Planning only: nothing should actually be deployed.
      - name: go_no_actual_deploy
        type: tool-calls
        config:
          disallowed:
            - name: "^(bash|powershell|run)$"
              command: "\\bazd\\s+up\\b|func\\s+azure\\s+functionapp\\s+publish\\b|az\\s+functionapp\\s+create\\b"

      # Globals
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"
