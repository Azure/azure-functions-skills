# Vally project configuration for azure-functions-skills
# Docs: https://aka.ms/vally
#
# Suites filter across all evals/**/eval.yaml using stimulus tags.
# These suites expose all template skills, not an isolated OFF baseline.
# For the target-only benchmark use npm run eval:run (see experiments/README.md).
# Never execute agent evaluations in PR-triggered CI or on untrusted code.
# Run with:  npx vally eval --suite smoke
#            npx vally eval --suite pr
#            npx vally eval --suite full

paths:
  skills:
    - templates/skills
  evals:
    - evals
  results: results

suites:
  smoke:
    description: "Quick routing checks — minimal LLM cost"
    filter:
      tier: smoke

  pr:
    description: "Legacy smoke alias — trusted manual/reviewer-gated runs only"
    filter:
      tier: smoke

  triggers:
    description: "All routing/skill-invocation evals"
    filter:
      area: routing

  integration:
    description: "All behavior/response-quality evals (LLM-backed)"
    filter:
      type: integration

  live:
    description: "Tier 3 — actually deploys Azure resources (manual / nightly only)"
    filter:
      tier: live

  full:
    description: "All evals (including LLM graders, EXCLUDING live deploy) — nightly"
    filter:
      tier:
        - smoke
        - full
