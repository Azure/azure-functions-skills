name: Skill Benchmark

# Runs the paid Vally model benchmark and publishes the dashboard.
# There is no `pull_request` trigger on purpose: `runBenchmark()` refuses to
# start a paid evaluation when GITHUB_EVENT_NAME starts with `pull_request`.
# Manual dispatch is the only trigger. Thus only a person with write access can
# start a run, and the evaluated code is always reviewed code.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Model tier to measure. `all` runs every registered model.
        required: true
        default: all
        type: choice
        options:
          - all
          - powerful
          - medium
          - low

permissions:
  contents: read

concurrency:
  group: skill-benchmark
  cancel-in-progress: false

env:
  DASHBOARD_ARTIFACT: benchmark-dashboard-${{ github.run_id }}

jobs:
  # The work is split into two jobs on purpose. Permissions apply to a whole
  # job, and this job gives its token to the evaluated agent. Skill content can
  # contain prompt injection, and the agent runs shell commands, so this job
  # must have no write permission. It only measures and uploads an artifact.
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    # Seven models x two arms = fourteen serial trials at a ten-minute
    # timeout each, plus setup.
    timeout-minutes: 360
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use public npm registry
        run: rm -f .npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Azure Functions Core Tools (func)
        # The benchmark environment keeps PATH, so a global `func` stays
        # available to each trial.
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Prepare isolated benchmark directories
        # `--run-root` and `--output` must be outside the repository, and every
        # ancestor of the run root must be free of agent discovery files.
        # `/tmp` and `/` are clean; the work directory is not.
        run: mkdir -p /tmp/bench/root

      - name: Run benchmark
        id: benchmark
        # The token is scoped to this step only. `copilot-requests: write` on
        # the job makes the Actions token usable for model requests. This is
        # assumed, not confirmed, for `@github/copilot-sdk`: if the run fails
        # with an authentication error, the token is the first thing to check.
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier || 'all' }}
        run: |
          set -uo pipefail
          TIER_ARG=()
          if [ "${TIER}" != "all" ]; then
            TIER_ARG=(--tier "${TIER}")
          fi
          echo "Tier: ${TIER}"
          # Actions starts each `run` block with `bash -e`, and `set -uo` does
          # not cancel `-e`. A bare command would stop the step before the
          # status is captured, so the call goes in an `if` condition, where
          # `-e` does not apply.
          if npm run eval -- --all --trusted --run-root /tmp/bench/root --output /tmp/bench/out "${TIER_ARG[@]}"; then
            CODE=0
          else
            CODE=$?
          fi
          echo "exit-code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload dashboard artifact
        # The dashboard must reach the publish job even when a trial fails.
        # The generated site has more than one file: `index.html` refers to
        # `azure-functions-skills-logo.png` by a relative URL in the same
        # directory. Thus the whole directory is uploaded, not one file.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DASHBOARD_ARTIFACT }}
          path: /tmp/bench/out/site/
          if-no-files-found: warn

      - name: Report the benchmark result
        if: always()
        run: |
          set -euo pipefail
          CODE="${{ steps.benchmark.outputs.exit-code }}"
          echo "Benchmark exit code: ${CODE:-unknown}"
          test "${CODE}" = "0"

  # This job holds the write permissions, and it never runs Vally. Thus the
  # evaluated agent cannot reach this token.
  publish:
    name: publish
    needs: benchmark
    # A failed measurement still gives a dashboard, and that dashboard is the
    # most useful thing to look at. So publish always runs; the `benchmark`
    # job result reports the failure.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_BRANCH: bot/benchmark-dashboard
      REPORT_DIR: reports/benchmarks/current
    steps:
      - name: Checkout
        # The dashboard branch must start from the default branch. The
        # `benchmark` job measures the dispatched branch on purpose, but a
        # checkout of that branch here would put its unrelated changes into
        # the dashboard pull request.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download dashboard artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.DASHBOARD_ARTIFACT }}
          path: dashboard

      - name: Open or update the dashboard pull request
        # `main` is protected, so the dashboard reaches GitHub Pages through a
        # pull request. One fixed branch is force-pushed, so a later run
        # updates the open pull request instead of opening a second one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f dashboard/index.html ]; then
            echo "No dashboard was generated; there is nothing to publish."
            exit 0
          fi
          git checkout -B "${PR_BRANCH}"
          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"
          cp -R dashboard/. "${REPORT_DIR}/"
          git add --force "${REPORT_DIR}"
          if git diff --cached --quiet; then
            echo "Dashboard is unchanged; no pull request is needed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c commit.gpgsign=false \
              commit -m "chore: refresh the benchmark dashboard"
          git push --force origin "${PR_BRANCH}"
          if gh pr view "${PR_BRANCH}" --json number >/dev/null 2>&1; then
            echo "The pull request already exists; the force-push updated it."
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" \
              --head "${PR_BRANCH}" \
              --title 'chore: refresh the benchmark dashboard' \
              --body 'Automated update of `reports/benchmarks/current/` from the Skill Benchmark workflow. Merge to publish it at https://azure.github.io/azure-functions-skills/benchmarks/.'
          fi
